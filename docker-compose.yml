version: '3.9'

services:

  postgres-db1:
    image: postgres:16
    container_name: dbdiff-db1

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db1

    ports:
      - "5433:5432"

    volumes:
      - ./db1-init.sql:/docker-entrypoint-initdb.d/init.sql

  postgres-db2:
    image: postgres:16
    container_name: dbdiff-db2

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db2

    ports:
      - "5434:5432"

    volumes:
      - ./db2-init.sql:/docker-entrypoint-initdb.d/init.sql
